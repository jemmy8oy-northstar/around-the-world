<!doctype html>
<!--
  data-theme names which of the design system's themes this app wears; the
  vendored `styles/design-system/themes/casual.css` block only applies to an
  element carrying it, so removing this attribute leaves every --color-* role
  undefined and the app unstyled. Adding data-mode="dark" here flips the whole
  app to the casual theme's dark mode — that is the only supported way to get
  a dark app, and there is no second palette to maintain for it.
-->
<html lang="en" data-theme="casual">
  <head>
    <meta charset="UTF-8" />
    <!-- Must name a file that actually exists in frontend/public/. Vite rewrites this href
         against `base` at build time, so a generated app serves it from its own path prefix;
         it does not fall back to anything when the file is missing, it just 404s. -->
    <link rel="icon" type="image/svg+xml" href="/balenthiran.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Colours the phone's own chrome (address bar, task switcher) to match
         --bg-page, so the app does not sit in a mismatched browser frame.
         ⚠️ A literal, and it cannot be a var(): this element is parsed before
         any stylesheet exists. It must be kept in step by hand with the casual
         theme's --color-bg (= --warm-50 in design-system/primitives.css). -->
    <meta name="theme-color" content="#faf8f5" />

    <!-- Fonts are linked here rather than @import-ed from index.css. An
         @import inside a stylesheet cannot start downloading until that
         stylesheet has itself been fetched and parsed, which serialises two
         round trips before any text can render — on pub wifi that is the
         difference between a slow app and a blank one. preconnect opens the
         two Google Fonts connections in parallel with the CSS request. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />

    <title>Around the World</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
