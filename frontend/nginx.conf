server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /around-the-world {
        return 301 /around-the-world/;
    }

    location /around-the-world/ {
        try_files $uri /around-the-world/index.html;
    }

    # Optional: cache static files aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
