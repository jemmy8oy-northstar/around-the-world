server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # The app is served from a subpath (balenthiran.co.uk/birthday) and the
    # ingress does NOT rewrite it away, so nginx sees the prefix and the build
    # output lives under a matching directory. Keep this in step with `base` in
    # vite.config.ts and the ingress paths in helm/values.yaml.
    location = /birthday {
        return 301 /birthday/;
    }

    location /birthday/ {
        try_files $uri /birthday/index.html;
    }

    # Cache the fingerprinted build assets aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires max;
        log_not_found off;
    }
}
